<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<title>Adafrus — አደፍርስ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://commons.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Figtree:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@600;800&family=Noto+Sans+Ethiopic:wght@400;600;700&family=Abyssinica+SIL&family=Playfair+Display:wght@600;800&family=Lora:wght@600;700&family=Merriweather:wght@700&display=swap">
<style>
:root{
  /* Refined Ethiopian Branna (Parchment), Aksumite Indigo, Burnished Gold & Highland Emerald */
  --bg:#F7F3E8;
  --surface:#FFFDF8;
  --surface2:#EFE9D8;
  --ink:#162238;
  --muted:#5B6578;
  --line:#DFD6C0;
  --gold:#D4942A;
  --gold-ink:#141000;
  --green:#1E6B52;
  --red:#A63A3A;
  --hero:#162238;
  --hero-mid:#223454;
  --hero-dark:#0D1524;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220;
    --surface:#141D30;
    --surface2:#1C2740;
    --ink:#F2EFE6;
    --muted:#9AA4B8;
    --line:#283552;
    --gold:#EBB046;
    --gold-ink:#120E00;
    --green:#3BB88B;
    --red:#E06666;
    --hero:#111A2E;
    --hero-mid:#1A2845;
    --hero-dark:#080D18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220;
  --surface:#141D30;
  --surface2:#1C2740;
  --ink:#F2EFE6;
  --muted:#9AA4B8;
  --line:#283552;
  --gold:#EBB046;
  --gold-ink:#120E00;
  --green:#3BB88B;
  --red:#E06666;
  --hero:#111A2E;
  --hero-mid:#1A2845;
  --hero-dark:#080D18;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree','Noto Sans Ethiopic',system-ui,sans-serif;line-height:1.52;padding-bottom:84px}
h1,h2,h3{font-family:var(--hf,'Noto Serif Ethiopic'),'Newsreader',Georgia,serif;margin:0;line-height:1.22}

/* Traditional Ethiopian Tilet (ጥለት) geometric woven border */
.tilet{height:10px;background:
  linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 18px,var(--green) 18px 32px,transparent 32px 36px,var(--red) 36px 50px,transparent 50px 54px) 0 0/54px 10px,
  var(--hero-dark);
  border-bottom:1px solid rgba(212,148,42,.35);
}

/* Header */
header{display:flex;align-items:center;gap:12px;padding:10px clamp(16px,3vw,40px);margin:0;flex-wrap:wrap;background:linear-gradient(90deg,var(--hero-dark),var(--hero));color:#FFFDF8;box-shadow:0 4px 18px rgba(0,0,0,.22);position:sticky;top:0;z-index:15;border-bottom:1px solid rgba(212,148,42,.28)}
header .hr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header button,header select{color:#FFFDF8;border-color:rgba(212,148,42,.42);background:rgba(255,255,255,.07)}
header button:hover,header select:hover{background:rgba(212,148,42,.18);border-color:var(--gold)}
header option{color:#162238;background:#FFFDF8}
header .note{color:#E6DEC8;font-weight:600}
#proBtn{background:rgba(212,148,42,.2);border-color:var(--gold);color:#FFE2A8;font-weight:700}
#hq{flex:1 1 210px;max-width:520px;order:3;background:rgba(255,253,248,.96);color:#162238;border:1px solid rgba(212,148,42,.4);border-radius:999px;padding:8px 18px}
#hq::placeholder{color:#687182}
.logo{font-family:var(--hf,'Noto Serif Ethiopic'),serif;font-weight:800;background:linear-gradient(135deg,#FFFDF8,#F5ECD6);color:var(--hero)!important;padding:2px 16px;border-radius:999px;font-size:1.45rem;letter-spacing:-.01em;cursor:pointer;border:1.5px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.2)}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;transition:transform .12s,background .15s,border-color .15s}
button:active{transform:scale(.97)}
button.primary{background:var(--hero);color:#FFFDF8;border-color:var(--hero);font-weight:600}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
button.gold:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Full-screen container with subtle Ethiopian manuscript frame */
main{width:100%;max-width:1440px;margin:auto;padding:0 clamp(14px,3vw,36px) 60px;position:relative}
#tabs{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
#q{flex:1 1 220px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chips button{padding:6px 13px;font-size:.86rem;border-color:var(--line);background:var(--surface)}
.chips button.on{background:var(--hero);color:#FFFDF8;border-color:var(--gold);font-weight:600}

/* Meaningful Ethiopian Branna & Harag Ornamental Frame for Hero */
.imdb-hero{display:grid;grid-template-columns:2.1fr 1fr;gap:18px;margin-top:16px;align-items:stretch;min-height:clamp(340px,52vh,510px)}
.spot{position:relative;overflow:hidden;border-radius:22px;color:#FFFDF8;background:radial-gradient(circle at 82% 18%,rgba(212,148,42,.26),transparent 52%),linear-gradient(135deg,var(--hero-mid),var(--hero-dark) 85%);padding:clamp(22px,3.2vw,42px);display:grid;grid-template-columns:1fr clamp(138px,15vw,210px);gap:clamp(16px,2.5vw,32px);align-items:center;box-shadow:0 16px 36px rgba(13,21,36,.24);border:1.5px solid rgba(212,148,42,.45)}
/* Ornamental corner frame (Harag motif) */
.spot:after{content:"";position:absolute;inset:10px;border:1px solid rgba(212,148,42,.28);border-radius:14px;pointer-events:none}
.spot:before{content:"❖ አ ❖";position:absolute;right:18px;bottom:10px;font-family:'Noto Serif Ethiopic',serif;font-size:3.2rem;letter-spacing:.2em;line-height:1;color:rgba(212,148,42,.18);pointer-events:none}
.spot .k{display:inline-flex;align-items:center;gap:6px;letter-spacing:.14em;font-size:.78rem;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.spot h1{font-size:clamp(1.85rem,3.5vw,3rem);font-weight:800;color:#FFFDF8}
.spot .sub-author{color:#EADBC0;font-size:clamp(.95rem,1.3vw,1.15rem);margin-top:6px;font-weight:600}
.spot p{color:#DCE2EE;max-width:56ch;font-size:clamp(.92rem,1.1vw,1.04rem);margin:12px 0 14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.spot .bk{transform:rotate(2deg);filter:drop-shadow(0 18px 28px rgba(0,0,0,.55));border:none;padding:0;background:none;border-radius:12px;width:100%;position:relative;z-index:2}
.spot-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:2}
.spot-actions .wl-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(212,148,42,.45);font-weight:600}
.spot-actions .wl-btn.saved{background:var(--green);border-color:var(--green)}
.dots{display:flex;gap:8px;margin-top:18px;position:relative;z-index:2}
.dots button{width:32px;height:6px;padding:0;border-radius:9px;border:none;background:rgba(255,255,255,.28)}
.dots button.on{background:var(--gold);width:54px}

/* Up Next Sidebar */
.upnext-box{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.upnext-box h3{font-size:1.02rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.upn-list{display:grid;gap:10px;flex:1}
.un{display:flex;gap:12px;text-align:left;border-radius:14px;border:1px solid transparent;background:var(--surface2);padding:8px 10px;align-items:center;width:100%}
.un.on{border-color:var(--gold);background:var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.un .cover{width:46px;flex:none;padding:0;border-radius:6px;box-shadow:none}
.un .cover .cov-txt,.un .cover .badge{display:none}
.un strong{display:block;font-size:.94rem;line-height:1.25}
.un small{display:block;color:var(--muted);font-size:.8rem}

/* Section Headers with Ethiopian Harag diamond ornament */
h2.sec{display:flex;align-items:center;gap:10px;font-size:clamp(1.25rem,1.8vw,1.55rem);margin:32px 0 14px;font-weight:800}
h2.sec:before{content:"❖";color:var(--gold);font-size:.95em;flex:none}
h2.sec:after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,var(--gold),var(--line) 40%,transparent)}

/* Book Cards & Shelves */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px;margin-top:14px}
.row{display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.row .card{width:168px;flex:none}
.card{text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;width:100%;transition:transform .18s,box-shadow .18s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(22,34,56,.12);border-color:var(--gold)}
.cover{aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#FFFDF8;background-image:linear-gradient(155deg,rgba(255,255,255,.16),rgba(0,0,0,.38));position:relative;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.2);overflow:hidden}
.card .cover{border-radius:0;box-shadow:none}
.cover:after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(0,0,0,.28)}
.cover img.cov-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover .cov-txt{position:relative;z-index:0;display:flex;flex-direction:column;justify-content:space-between;height:100%;border:1px solid rgba(255,255,255,.18);padding:8px;border-radius:6px}
.cover b{font-family:'Noto Serif Ethiopic','Newsreader',serif;font-size:1.02rem;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.cover span{font-size:.73rem;opacity:.92}
.badge{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--gold-ink);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* Quick bookmark ribbon on cards */
.rib{position:absolute;top:0;left:8px;z-index:3;background:rgba(22,34,56,.82);color:#fff;border:none;border-radius:0 0 8px 8px;padding:4px 9px;font-size:.85rem;font-weight:700;line-height:1;backdrop-filter:blur(4px)}
.rib.on{background:var(--green);color:#fff}

.meta{padding:10px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.meta .rline{display:flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--ink)}
.meta .rline .st{color:var(--gold)}
.meta strong{display:block;font-family:'Noto Serif Ethiopic','Newsreader',serif;font-size:.95rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta small{color:var(--muted);font-size:.8rem}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}

/* Top 10 IMDb-style numbered cards */
.t10{display:flex;align-items:flex-end;flex:none;border:none;background:none;padding:0;text-align:left;width:210px;position:relative}
.t10 .n{font-family:'Newsreader',serif;font-size:6.8rem;font-weight:800;line-height:.78;color:var(--bg);-webkit-text-stroke:2.5px var(--gold);margin-right:-16px;z-index:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.t10 .cover{width:134px}

/* Circular Author Portraits */
.av{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,var(--hero-mid),var(--hero-dark));color:#FFFDF8;display:grid;place-items:center;font-weight:800;font-size:1.6rem;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold);position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

/* Dialogs & Slide-out Menu */
dialog{border:1.5px solid var(--gold);border-radius:20px;padding:0;max-width:680px;width:calc(100% - 24px);background:var(--surface);color:var(--ink);max-height:92vh;box-shadow:0 24px 60px rgba(0,0,0,.48)}
dialog::backdrop{background:rgba(10,16,30,.68);backdrop-filter:blur(2px)}
.dl{padding:20px;display:grid;gap:14px}
dialog#menu{margin:0;height:100%;max-height:100%;width:300px;max-width:84vw;border-radius:0 20px 20px 0;overflow-y:auto;border:none;border-right:2px solid var(--gold)}
#menu .mhead{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
#menu .mclose{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:50%;font-size:1.1rem;font-weight:700;background:var(--surface2)}
#menu button.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:10px;border:none;padding:10px 12px;font-weight:500}
#menu button.mi:hover,#menu button.mi.on{background:var(--surface2);color:var(--gold);font-weight:700}

.top{display:flex;gap:16px}
.top .cover{width:124px;flex:none;border-radius:8px}
.rate button{border:none;padding:2px;font-size:1.9rem;color:var(--line);line-height:1}
.rate button.on{color:var(--gold)}
.rev{border-top:1px solid var(--line);padding-top:10px}
.rev p{margin:4px 0}
.rev small{color:var(--muted)}
.rev button{padding:3px 10px;font-size:.8rem;border-color:var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
.authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.note{font-size:.85rem;color:var(--muted)}
.err{color:var(--red);font-size:.9rem;margin:0;font-weight:600}
.form{display:grid;gap:8px}
.form label{font-size:.85rem;color:var(--muted);font-weight:600}

.post{border-top:1px solid var(--line);padding:12px 0}
.post:first-of-type{border-top:none;padding-top:0}
.post p{margin:6px 0}
.vbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--green)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.tiles button{border:1px solid rgba(255,255,255,.15);color:#FFFDF8;border-radius:16px;padding:16px 14px;text-align:left;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tiles button b{display:block;font-size:1.55rem;margin-bottom:4px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.award{border-radius:20px;padding:24px;color:#141000;background:linear-gradient(135deg,#F5CA6E,#D4942A);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-top:30px;box-shadow:0 8px 22px rgba(212,148,42,.25);border:1.5px solid #B57A19}
.award h3{font-size:1.5rem}
.award p{margin:4px 0 0}
.award button{background:#162238;color:#FFFDF8;border-color:#162238;font-weight:700}

.mapcard{border-radius:20px;padding:24px;margin-top:18px;color:#FFFDF8;background:linear-gradient(135deg,rgba(22,34,56,.92),rgba(30,107,82,.88)),repeating-linear-gradient(0deg,#fff2 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,#fff2 0 1px,transparent 1px 28px);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid rgba(212,148,42,.4)}

/* Author Profile Banner */
.auth-banner{border-radius:16px;padding:22px 18px;color:#FFFDF8;background:linear-gradient(135deg,var(--hero-mid),var(--hero-dark));background-size:cover;background-position:center;position:relative;overflow:hidden;border:1.5px solid var(--gold);text-align:center}
.auth-banner:before{content:"";position:absolute;inset:0;background:rgba(13,21,36,.58)}
.auth-banner>*{position:relative;z-index:1}

/* Chat bubble styling */
.chat-box{max-height:240px;overflow-y:auto;display:grid;gap:8px;padding:10px;background:var(--surface2);border-radius:12px;border:1px solid var(--line)}
.msg-b{padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.msg-b.me{background:var(--hero);color:#FFFDF8;border-color:var(--hero);margin-left:20px}

/* Bottom Navigation Bar */
#bn{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1.5px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#bn button{border:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;padding:4px 2px;border-radius:12px;color:var(--muted);font-weight:600}
#bn button b{font-size:1.22rem;line-height:1}
#bn button.on{color:var(--hero);background:rgba(212,148,42,.18);font-weight:700}

footer#ft{background:var(--hero-dark);color:#E5DEC8;padding:28px 18px;text-align:center;margin-top:36px;border-top:2px solid var(--gold)}
.fl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.fl button{border:none;color:#E5DEC8;padding:4px 10px}

.pill-tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700}
.pill-ok{background:rgba(30,107,82,.16);color:var(--green)}
.pill-wait{background:rgba(212,148,42,.22);color:var(--gold)}
.pill-no{background:rgba(166,58,58,.16);color:var(--red)}

.plans,.memb{display:none}
#bell{border-color:rgba(212,148,42,.42)}

@media (max-width:860px){
  .imdb-hero{grid-template-columns:1fr;min-height:auto}
  .upn-list{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .two{grid-template-columns:1fr}
}
@media (max-width:540px){
  .spot{grid-template-columns:1fr 106px;padding:18px 15px;min-height:250px}
  .spot:before{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="tilet"></div>
<header>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <div class="logo" id="logo"></div>
  <input id="hq" type="search">
  <div class="hr">
    <button id="proBtn"></button>
    <button id="listBtn"></button>
    <select id="lg" aria-label="Language">
      <option value="am">🌐 አማርኛ</option>
      <option value="en">🌐 English</option>
      <option value="om">🌐 Afaan Oromoo</option>
      <option value="ti">🌐 ትግርኛ</option>
    </select>
    <button id="inboxBtn" aria-label="Messages">💬</button>
    <button id="bell" aria-label="Notifications"></button>
    <span id="who" class="note"></span>
    <button id="loginBtn" class="primary"></button>
  </div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <p class="note" id="foot"></p>
</main>
<div class="tilet"></div>
<footer id="ft"></footer>
<nav id="bn"></nav>
<dialog id="login"><div class="dl" id="lgc"></div></dialog>
<dialog id="bk"><div class="dl" id="bkc"></div></dialog>
<dialog id="menu"><div class="dl" id="mc"></div></dialog>
<dialog id="nt"><div class="dl" id="ntc"></div></dialog>

<script>
const LC=["am","en","om","ti"];let li=0;

   if(doc&&doc.cover_i)return saveHit(`https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`);
  }
  for(const lc of ["en","am"]){

   if(rw.ok){

  }

}

async function lookupAuthorPhoto(canon,ae){
 if(AUTH_CACHE[canon]!==undefined)return AUTH_CACHE[canon]||"";

 try{

   }
  }
 }catch(e){}
 return saveA("");

// Fast parallel hydration for visible covers & author portraits
let hydrating=false;
async function hydrateVisibleCovers(){
 if(hydrating)return;
 hydrating=true;
 try{
  const missing=books.filter(b=>!getCoverSrc(b)&&COV_CACHE[b.e||b.t]===undefined).slice(0,16);
  await Promise.allSettled(missing.map(async b=>{
   const url=await lookupBookCover(b);
   if(url){
    document.querySelectorAll(`[data-cov-id="${b.id}"]`).forEach(el=>{
     if(!el.querySelector("img.cov-img")){
      const img=document.createElement("img");
      img.className="cov-img";img.src=url;img.alt=bt(b);img.decoding="async";
      img.onerror=()=>img.remove();
      el.appendChild(img);
     }
    });
   }
  }));
  // Hydrate missing author avatars in parallel
  const stats=authorStats().slice(0,20);
  await Promise.allSettled(stats.map(async x=>{
   const meta=AUTH_META[x.a]||{};
   if(meta.img||DEFAULT_AUTHOR_PHOTOS[x.a]||AUTH_CACHE[x.a]!==undefined)return;
   const u=await lookupAuthorPhoto(x.a,x.ae);
   if(u){
    document.querySelectorAll(`[data-av="${CSS.escape(x.a)}"]`).forEach(el=>{
     if(!el.querySelector("img")){
      const img=document.createElement("img");
      img.src=u;img.alt=nm(x.a,x.ae);img.decoding="async";
      img.onerror=()=>img.remove();
      el.appendChild(img);
     }
    });
   }
  }));
 }finally{hydrating=false}
}

// Unified Author Stats (merges duplicate author spellings into a single profile)
function authorStats(){
 const m={};
 books.forEach(b=>{
  const canon=normAuthor(b.a);
  if(canon==="—"||canon==="ልዩ ልዩ"||canon==="ልዩ ልዩ ደረስቲ")return;
  const x=m[canon]=m[canon]||{a:canon,ae:b.ae||canon,w:0,s:0,c:0,ver:false};
  x.w+=b.r[1];x.s+=b.r[0]*b.r[1];x.c++;
  if(isAuthorVerified(canon))x.ver=true;
 });
 return Object.values(m).map(x=>({...x,avg:x.w?x.s/x.w:0})).sort((p,q)=>q.c-p.c||q.w*q.avg-p.w*p.avg);
}
