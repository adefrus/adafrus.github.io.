<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<title>Adefris — አደፍርስ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://commons.wikimedia.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Figtree:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@600;800&family=Noto+Sans+Ethiopic:wght@400;600;700&family=Abyssinica+SIL&family=Playfair+Display:wght@600;800&family=Lora:wght@600;700&family=Merriweather:wght@700&display=swap">
<style>
:root{
  --bg:#F6F5F2;
  --surface:#FFFFFF;
  --surface2:#ECEAE4;
  --ink:#141B2D;
  --muted:#5C6475;
  --line:#E2DFD7;
  --gold:#D99B26;
  --gold-ink:#141000;
  --green:#1C6E52;
  --red:#B83B3B;
  --hero:#141B2D;
  --hero-mid:#1E2942;
  --hero-dark:#0D121F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F19;
    --surface:#131A2B;
    --surface2:#1B243B;
    --ink:#F2F3F7;
    --muted:#98A2B8;
    --line:#25304A;
    --gold:#F0B43C;
    --gold-ink:#120E00;
    --green:#38B88A;
    --red:#E06060;
    --hero:#101626;
    --hero-mid:#18223A;
    --hero-dark:#080B14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F19;
  --surface:#131A2B;
  --surface2:#1B243B;
  --ink:#F2F3F7;
  --muted:#98A2B8;
  --line:#25304A;
  --gold:#F0B43C;
  --gold-ink:#120E00;
  --green:#38B88A;
  --red:#E06060;
  --hero:#101626;
  --hero-mid:#18223A;
  --hero-dark:#080B14;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree','Noto Sans Ethiopic',system-ui,sans-serif;line-height:1.5;padding-bottom:84px}
h1,h2,h3{font-family:var(--hf,'Noto Serif Ethiopic'),'Newsreader',Georgia,serif;margin:0;line-height:1.22}

/* Clean, Uncrowded Header with Dark/Light Toggle & Right-Aligned Utilities */
header{display:flex;align-items:center;gap:8px;padding:8px clamp(12px,2.5vw,32px);margin:0;flex-wrap:wrap;background:var(--hero);color:#FFFFFF;box-shadow:0 2px 12px rgba(0,0,0,.16);position:sticky;top:0;z-index:15}
header .hr{margin-left:auto;display:flex;gap:6px;align-items:center}
header button,header select{color:#FFFFFF;border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.08);padding:6px 11px;font-size:.84rem}
header button:hover,header select:hover{background:rgba(255,255,255,.16)}
header option{color:#141B2D;background:#FFFFFF}
header .note{color:#CBD5E1;font-weight:600;font-size:.82rem;max-width:95px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#proBtn{border-color:var(--gold);color:var(--gold);font-weight:700}
#admTopBtn{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
#themeTopBtn{padding:6px 10px;font-size:.9rem}
#hq{flex:0 1 230px;min-width:130px;background:rgba(255,255,255,.95);color:#141B2D;border:none;border-radius:999px;padding:6px 14px;font-size:.85rem}
#hq::placeholder{color:#64748B}
.logo{font-family:var(--hf,'Noto Serif Ethiopic'),serif;font-weight:800;background:#FFFFFF;color:#141B2D!important;padding:2px 14px;border-radius:999px;font-size:1.3rem;cursor:pointer;flex:none}
@media (max-width:720px){
  #hq{order:3;flex:1 1 100%;max-width:100%}
  #listBtn{display:none}
}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;transition:transform .12s,background .15s,border-color .15s}
button:active{transform:scale(.97)}
button.primary{background:var(--hero);color:#FFFFFF;border-color:var(--hero);font-weight:600}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
button.gold:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

main{width:100%;max-width:1400px;margin:auto;padding:0 clamp(14px,3vw,32px) 60px}
#tabs{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
#q{flex:1 1 220px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chips button{padding:6px 13px;font-size:.86rem;border-color:var(--line);background:var(--surface)}
.chips button.on{background:var(--hero);color:#FFFFFF;border-color:var(--hero);font-weight:600}

/* Clean Editorial Spotlight + Up Next Hero (No childish frames) */
.imdb-hero{display:grid;grid-template-columns:2.1fr 1fr;gap:16px;margin-top:16px;align-items:stretch;min-height:clamp(320px,48vh,480px)}
.spot{position:relative;overflow:hidden;border-radius:18px;color:#FFFFFF;background:linear-gradient(135deg,var(--hero-mid),var(--hero-dark) 88%);padding:clamp(22px,3vw,38px);display:grid;grid-template-columns:1fr clamp(132px,14vw,196px);gap:clamp(16px,2.5vw,28px);align-items:center;box-shadow:0 12px 28px rgba(13,18,31,.18)}
.spot>.spot-art-bg{position:absolute;inset:-24px;background-size:cover;background-position:center top;filter:blur(26px) saturate(1.25) brightness(.75);transform:scale(1.12);opacity:.48;pointer-events:none;z-index:0}
.spot>.spot-art-veil{position:absolute;inset:0;background:linear-gradient(115deg,rgba(13,18,31,.82) 0%,rgba(20,27,45,.65) 55%,rgba(13,18,31,.76) 100%);pointer-events:none;z-index:0}
.spot>div,.spot>button{position:relative;z-index:1}
.spot .k{display:inline-flex;align-items:center;gap:6px;letter-spacing:.12em;font-size:.75rem;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
.spot h1{font-size:clamp(1.75rem,3.4vw,2.85rem);font-weight:800;color:#FFFFFF}
.spot .sub-author{color:#CBD5E1;font-size:clamp(.95rem,1.2vw,1.1rem);margin-top:6px;font-weight:600}
.spot p{color:#E2E8F0;max-width:54ch;font-size:clamp(.9rem,1.05vw,1.02rem);margin:12px 0 14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.spot .bk{filter:drop-shadow(0 14px 24px rgba(0,0,0,.45));border:none;padding:0;background:none;border-radius:10px;width:100%}
.spot-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.spot-actions .wl-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);font-weight:600}
.spot-actions .wl-btn.saved{background:var(--green);border-color:var(--green)}
.dots{display:flex;gap:8px;margin-top:16px}
.dots button{width:30px;height:5px;padding:0;border-radius:9px;border:none;background:rgba(255,255,255,.28)}
.dots button.on{background:var(--gold);width:50px}

.upnext-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.upnext-box h3{font-size:.98rem;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.upn-list{display:grid;gap:8px;flex:1}
.un{display:flex;gap:12px;text-align:left;border-radius:12px;border:1px solid transparent;background:var(--surface2);padding:8px 10px;align-items:center;width:100%}
.un.on{border-color:var(--gold);background:var(--surface)}
.un .cover{width:44px;flex:none;padding:0;border-radius:6px;box-shadow:none}
.un .cover .cov-txt,.un .cover .badge{display:none}
.un strong{display:block;font-size:.92rem;line-height:1.25}
.un small{display:block;color:var(--muted);font-size:.78rem}

/* Section Headers */
h2.sec{display:flex;align-items:center;gap:10px;font-size:clamp(1.2rem,1.7vw,1.48rem);margin:30px 0 14px;font-weight:800}
h2.sec:before{content:"";width:4px;height:1.15em;border-radius:3px;background:var(--gold);flex:none}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}

/* Book Cards & Shelves */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:16px;margin-top:14px}
.row{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.row .card{width:164px;flex:none}
.card{text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;width:100%;transition:transform .18s,box-shadow .18s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,27,45,.1)}
.cover{aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#FFFFFF;background-image:linear-gradient(155deg,rgba(255,255,255,.14),rgba(0,0,0,.36));position:relative;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.18);overflow:hidden}
.card .cover{border-radius:0;box-shadow:none}
.cover:after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(0,0,0,.25)}
.cover img.cov-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover .cov-txt{position:relative;z-index:0;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:4px}
.cover b{font-family:'Noto Serif Ethiopic','Newsreader',serif;font-size:1rem;line-height:1.25}
.cover span{font-size:.73rem;opacity:.9}
.badge{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--gold-ink);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;z-index:2}

.rib{position:absolute;top:0;left:8px;z-index:3;background:rgba(20,27,45,.82);color:#fff;border:none;border-radius:0 0 8px 8px;padding:4px 9px;font-size:.85rem;font-weight:700;line-height:1}
.rib.on{background:var(--green);color:#fff}

.meta{padding:10px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.meta .rline{display:flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--ink)}
.meta .rline .st{color:var(--gold)}
.meta strong{display:block;font-family:'Noto Serif Ethiopic','Newsreader',serif;font-size:.94rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta small{color:var(--muted);font-size:.8rem}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}

/* Top 10 Editorial Cards: Crisp Top-Right Rank Badge (Zero Clipping) */
.t10{display:flex;flex-direction:column;flex:none;border:1px solid var(--line);background:var(--surface);padding:0;text-align:left;width:166px;border-radius:14px;overflow:hidden;position:relative;transition:transform .18s,box-shadow .18s}
.t10:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,27,45,.12)}
.t10 .n{position:absolute;top:8px;right:8px;z-index:3;min-width:34px;height:30px;padding:0 9px;border-radius:999px;background:linear-gradient(135deg,#F5C451,#C88A16);color:#141000;font-family:'Figtree',sans-serif;font-size:.9rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.35);border:1.5px solid #FFFDF8}
.t10 .cover{width:100%;border-radius:0;box-shadow:none}

/* Author Portraits */
.av{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--hero-mid),var(--hero-dark));color:#FFFFFF;display:grid;place-items:center;font-weight:800;font-size:1.55rem;box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--gold);position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

/* Advertisement Slot */
.ad-slot{background:var(--surface2);border:1px dashed var(--line);border-radius:16px;padding:16px 20px;margin:24px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ad-tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}

/* Events Cards */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:12px}
.ev-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px}
.ev-date{display:inline-block;background:var(--surface2);color:var(--gold);font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:999px;width:fit-content}

/* Dialogs & Slide-out Menu */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;max-width:660px;width:calc(100% - 24px);background:var(--surface);color:var(--ink);max-height:92vh;box-shadow:0 20px 50px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,15,28,.65);backdrop-filter:blur(2px)}
.dl{padding:20px;display:grid;gap:14px}
dialog#menu{margin:0;height:100%;max-height:100%;width:290px;max-width:84vw;border-radius:0 18px 18px 0;overflow-y:auto;border:none}
#menu .mhead{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
#menu .mclose{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:50%;font-size:1rem;font-weight:700;background:var(--surface2)}
#menu button.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:10px;border:none;padding:9px 12px;font-weight:500}
#menu button.mi:hover,#menu button.mi.on{background:var(--surface2);color:var(--gold);font-weight:700}

.top{display:flex;gap:16px}
.top .cover{width:120px;flex:none;border-radius:8px}
.rate button{border:none;padding:2px;font-size:1.9rem;color:var(--line);line-height:1}
.rate button.on{color:var(--gold)}
.rev{border-top:1px solid var(--line);padding-top:10px}
.rev p{margin:4px 0}
.rev small{color:var(--muted)}
.rev button{padding:3px 10px;font-size:.8rem;border-color:var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.note{font-size:.85rem;color:var(--muted)}
.err{color:var(--red);font-size:.9rem;margin:0;font-weight:600}
.form{display:grid;gap:8px}
.form label{font-size:.85rem;color:var(--muted);font-weight:600}

.post{border-top:1px solid var(--line);padding:12px 0}
.post:first-of-type{border-top:none;padding-top:0}
.post p{margin:6px 0}
.vbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--green)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.tiles button{border:none;color:#FFFFFF;border-radius:14px;padding:15px 14px;text-align:left;font-weight:700}
.tiles button b{display:block;font-size:1.45rem;margin-bottom:4px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.award{border-radius:18px;padding:22px;color:#141000;background:linear-gradient(135deg,#F7D070,#D99B26);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-top:28px}
.award h3{font-size:1.45rem}
.award p{margin:4px 0 0}
.award button{background:#141B2D;color:#FFFFFF;border-color:#141B2D;font-weight:700}

.prem-ban{border-radius:18px;padding:22px;color:#FFFFFF;background:linear-gradient(135deg,#1C6E52,#114232);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.plan{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface)}
.plan.pro{border:2px solid var(--gold)}
.plan ul{padding-left:18px;margin:10px 0;color:var(--muted)}

.mapcard{border-radius:18px;padding:22px;margin-top:18px;color:#FFFFFF;background:linear-gradient(135deg,#1E2942,#141B2D);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

.auth-banner{border-radius:14px;padding:22px 18px;color:#FFFFFF;background:linear-gradient(135deg,var(--hero-mid),var(--hero-dark));background-size:cover;background-position:center;position:relative;overflow:hidden;text-align:center}
.auth-banner:before{content:"";position:absolute;inset:0;background:rgba(13,18,31,.58)}
.auth-banner>*{position:relative;z-index:1}

.chat-box{max-height:240px;overflow-y:auto;display:grid;gap:8px;padding:10px;background:var(--surface2);border-radius:12px;border:1px solid var(--line)}
.msg-b{padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.msg-b.me{background:var(--hero);color:#FFFFFF;border-color:var(--hero);margin-left:20px}

#bn{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
#bn button{border:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.73rem;padding:4px 2px;border-radius:12px;color:var(--muted);font-weight:600}
#bn button b{font-size:1.2rem;line-height:1}
#bn button.on{color:var(--hero);background:rgba(217,155,38,.18);font-weight:700}

footer#ft{background:var(--hero-dark);color:#CBD5E1;padding:28px 18px;text-align:center;margin-top:36px}
.fl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.fl button{border:none;color:#CBD5E1;padding:4px 10px}

.vbadge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#1D9BF0,#0E7490);color:#fff;font-size:.68rem;font-weight:800;vertical-align:middle;margin-left:4px;box-shadow:0 2px 6px rgba(29,155,240,.38)}
.vbadge-lg{width:22px;height:22px;font-size:.78rem}
.tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:12px 0}
.tier{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.tier:hover,.tier.on{border-color:var(--gold);background:var(--surface2);transform:translateY(-2px)}
.tier .save-tag{display:inline-block;background:var(--green);color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.tier b{display:block;font-size:1.35rem;color:var(--ink);margin:4px 0}
.charity-card{border-radius:18px;padding:22px;background:linear-gradient(135deg,#141B2D,#1E3A5F);color:#fff;display:grid;gap:12px;margin-top:18px;border:1.5px solid rgba(217,155,38,.45)}
.pill-tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700}
.pill-ok{background:rgba(28,110,82,.15);color:var(--green)}
.pill-wait{background:rgba(217,155,38,.2);color:var(--gold)}
.pill-no{background:rgba(184,59,59,.15);color:var(--red)}

#bell{border-color:rgba(255,255,255,.24)}

@media (max-width:860px){
  .imdb-hero{grid-template-columns:1fr;min-height:auto}
  .upn-list{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .two{grid-template-columns:1fr}
}
@media (max-width:540px){
  .spot{grid-template-columns:1fr 104px;padding:18px 15px;min-height:240px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <div class="logo" id="logo"></div>
  <input id="hq" type="search">
  <div class="hr">
    <button id="admTopBtn" style="display:none">⚙️</button>
    <button id="proBtn"></button>
    <button id="listBtn"></button>
    <button id="themeTopBtn" aria-label="Light / Dark" title="Light / Dark">🌓</button>
    <button id="inboxBtn" aria-label="Messages">💬</button>
    <button id="bell" aria-label="Notifications"></button>
    <select id="lg" aria-label="Language">
      <option value="am">🌐 አማ</option>
      <option value="en">🌐 EN</option>

// Cover Image Lookup (Google Books & Open Library)
let COV_CACHE={};
try{COV_CACHE=JSON.parse(localStorage.getItem("adafrus_cov_cache")||"{}")}catch(e){}
const saveCovCache=()=>{try{localStorage.setItem("adafrus_cov_cache",JSON.stringify(COV_CACHE))}catch(e){}};

function getCoverSrc(b){
 if(!b)return "";
 if(b.img)return b.img;
 if(COV_CACHE[b.e])return COV_CACHE[b.e];
 if(b.isbn)return `https://covers.openlibrary.org/b/isbn/${b.isbn}-L.jpg?default=false`;
 return "";
}

async function lookupBookCover(b){
 const key=b.e||b.t;
 if(!key||COV_CACHE[key]!==undefined)return COV_CACHE[key]||"";
 const saveHit=u=>{COV_CACHE[key]=u;saveCovCache();return u};
 try{
  const queries=[`${b.t} ${b.ae||""}`.trim()];
  if(b.e&&b.e!==b.t)queries.push(`${b.e} ${b.ae||""}`.trim());
  for(const qRaw of queries){
   const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(qRaw)}&maxResults=2`);
   if(r.ok){
    const d=await r.json();
    const item=(d.items||[]).find(x=>x.volumeInfo&&x.volumeInfo.imageLinks);
    const links=item&&item.volumeInfo.imageLinks;
    const u=links&&(links.thumbnail||links.smallThumbnail);
    if(u)return saveHit(u.replace(/^http:/,"https://").replace("&edge=curl",""));
   }
  }
  const r3=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent((b.e||b.t)+" "+(b.ae||""))}&limit=2`);
  if(r3.ok){
   const d3=await r3.json();
   const doc=(d3.docs||[]).find(x=>x.cover_i);
   if(doc&&doc.cover_i)return saveHit(`https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`);
  }
  // 4. Internet Archive (archive.org) scanned books
  const iaQ=encodeURIComponent(`title:(${b.e||b.t}) AND mediatype:texts`);
  const r4=await fetch(`https://archive.org/advancedsearch.php?q=${iaQ}&fl[]=identifier&rows=2&output=json`);
  if(r4.ok){
   const d4=await r4.json();
   const hit=(d4.response&&d4.response.docs||[])[0];
   if(hit&&hit.identifier)return saveHit(`https://archive.org/services/img/${hit.identifier}`);
  }
 }catch(e){}
 return saveHit("");
}

let hydrating=false;
async function hydrateVisibleCovers(){
 if(hydrating)return;
 hydrating=true;
 try{
  const missing=books.filter(b=>!getCoverSrc(b)&&COV_CACHE[b.e||b.t]===undefined).slice(0,12);
  await Promise.allSettled(missing.map(async b=>{
   const url=await lookupBookCover(b);
   if(url){
    document.querySelectorAll(`[data-cov-id="${b.id}"]`).forEach(el=>{
     if(!el.querySelector("img.cov-img")){
      const img=document.createElement("img");
      img.className="cov-img";img.src=url;img.alt=bt(b);img.decoding="async";
      img.onerror=()=>img.remove();
      el.appendChild(img);
     }
    });
   }
  }));
 }finally{hydrating=false}
}

const cover=(b,badge,eager=false)=>{

  const rb=b.rare?`<div class="badge" style="top:${badge?"30px":"8px"};background:#141B2D;color:#F0B43C">👑 Rare</div>`:"";

    ${badge?`<div class="badge">${badge}</div>`:""}${rb}
    <div class="cov-txt"><b>${esc(bt(b))}</b>${emptyHint}<span>${esc(ba(b))}</span></div>

  </div>`;
};

const getAuthorPhoto=a=>{

const isAuthorVerified=a=>{

};

};

 $("#imp").onclick=async()=>{
  $("#imp").disabled=true;$("#imp").textContent="⏳ Loading...";
  const custom=books.filter(b=>b.img&&!(b.e||"").toLowerCase().includes("sample")&&!(b.t||"").includes("ናሙና")).map(b=>({...b,a:normAuthor(b.a)}));
  const merged=[...custom];
  STARTER_BOOKS.forEach(sb=>{
   const clean=JSON.parse(JSON.stringify(sb));
   clean.a=normAuthor(clean.a);
   if(!merged.some(x=>x.t===clean.t||x.e===clean.e))merged.push(clean);
  });
  merged.forEach((b,i)=>{b.id=i+1;b.a=normAuthor(b.a);revs[b.id]=revs[b.id]||[];recalc(b)});
  books.splice(0,books.length,...merged);
  nid=books.length+1;
  await saveBooks();
  render();
 };

 $("#fcov").onclick=async()=>{
  $("#fcov").disabled=true;
  let found=0;
  for(let i=0;i<books.length;i+=4){
   const batch=books.slice(i,i+4);
   $("#impStatus").textContent=`Searching web covers ${i+1}–${Math.min(i+4,books.length)} / ${books.length}...`;
   await Promise.all(batch.map(async b=>{
    if(!b.img){
     const u=await lookupBookCover(b);
     if(u){b.img=u;found++}
    }
   }));
  }
  await saveBooks();
  $("#impStatus").textContent=`✓ Done! Found and saved ${found} book covers. Tap Edit on any book to search Ethio Book Review, Google Images, Facebook, or TikTok and paste its cover!`;
  $("#fcov").disabled=false;
  render();
 };

function loadLocal(){try{const m=JSON.parse(localStorage.getItem("adafrus_kv")||"{}");
 if(m["lib/books"]&&Array.isArray(m["lib/books"].list))books.splice(0,books.length,...m["lib/books"].list.map(b=>({...b,a:normAuthor(b.a)})));
 if(m["lib/notes"]&&Array.isArray(m["lib/notes"].list))notes.splice(0,notes.length,...m["lib/notes"].list.map(n=>({...n,u:0})));
 Object.keys(m).forEach(k=>{if(k.startsWith("reviews/"))revs[k.slice(8)]=m[k].list});
 if(m["lib/settings"]){SET=m["lib/settings"];applySet()}
 if(m["lib/verified"])VER=m["lib/verified"].ids||[];
 if(m["lib/authors"])AUTH_META=m["lib/authors"];
 if(m["lib/events"]&&Array.isArray(m["lib/events"].list))EVENTS.splice(0,EVENTS.length,...m["lib/events"].list);
 if(m["lib/ads"])AD_CFG={...AD_CFG,...m["lib/ads"]};
 if(m["lib/critics"]&&Array.isArray(m["lib/critics"].list))CR.splice(0,CR.length,...m["lib/critics"].list);
 if(m["lib/stores"]&&Array.isArray(m["lib/stores"].list))ST.splice(0,ST.length,...m["lib/stores"].list);
 const me=m["data/users/local/me"];if(me){mine=me.mine||{};goal=me.goal||12;isPremium=!!me.isPremium}
 books.forEach(b=>{revs[b.id]=revs[b.id]||[];recalc(b)});nid=Math.max(...books.map(b=>b.id),105)+1}catch(e){}}

function authorStats(){
 const m={};
 books.forEach(b=>{
  if(!b)return;
  const canon=normAuthor(b.a);
  if(canon==="—"||canon==="ልዩ ልዩ"||canon==="ልዩ ልዩ ደረስቲ")return;
  const x=m[canon]=m[canon]||{a:canon,ae:b.ae||canon,w:0,s:0,c:0,ver:false};
  x.w+=(b.r&&b.r[1])||0;x.s+=((b.r&&b.r[0])||0)*((b.r&&b.r[1])||0);x.c++;
  if(isAuthorVerified(canon))x.ver=true;
 });
 return Object.values(m).map(x=>({...x,avg:x.w?x.s/x.w:0})).sort((p,q)=>q.c-p.c||q.w*q.avg-p.w*p.avg);
}

const mkDB=()=>({doc:p=>({get:async()=>{const r=await SB.from("kv").select("data").eq("path",p).maybeSingle();return{exists:!!r.data,data:()=>r.data&&r.data.data}},set:async d=>{const r=await SB.from("kv").upsert({path:p,data:d});if(r.error)throw r.error}}),collection:c=>({get:async()=>{const r=await SB.from("kv").select("path,data").like("path",c+"/%");return{docs:(r.data||[]).map(x=>({id:x.path.split("/")[1],data:()=>x.data}))}}})});
async function sbAuth(up,em,pw,n,role){
 const r=up?await SB.auth.signUp({email:em,password:pw,options:{data:{name:n,role}}}):await SB.auth.signInWithPassword({email:em,password:pw});
 if(r.error){$("#lerr").textContent=r.error.message;return}
 if(!r.data.session){$("#lerr").textContent="Check your email to confirm, then log in.";return}
 $("#login").close();await afterAuth(r.data.session)}
async function loadShared(){
 const g=async p=>{const r=await DB.doc(p).get();return r.exists?r.data():null};
 const [b,n,st,v,au,ev,ad,crData,stData,rv,fp,vt]=await Promise.all([
  g("lib/books"),
  g("lib/notes"),
  g("lib/settings"),
  g("lib/verified"),
  g("lib/authors"),
  g("lib/events"),
  g("lib/ads"),
  g("lib/critics"),
  g("lib/stores"),
  SB.from("reviews").select("*").order("created",{ascending:false}),
  SB.from("posts").select("*").order("created",{ascending:false}).limit(50),
  SB.rpc("vote_totals",{y:2026})
 ]);
 if(b&&Array.isArray(b.list)&&b.list.length)books.splice(0,books.length,...b.list.filter(Boolean).map(x=>({...x,a:normAuthor(x.a),r:x.r||[0,0]})));else if(isAdmin)saveBooks();
 if(n&&Array.isArray(n.list))notes.splice(0,notes.length,...n.list.map(x=>({...x,u:0})));
 if(st){SET=st;applySet()}
 VER=v?v.ids||[]:[];
 AUTH_META=au||{};
 if(ev&&Array.isArray(ev.list)&&ev.list.length)EVENTS.splice(0,EVENTS.length,...ev.list);
 if(ad)AD_CFG={...AD_CFG,...ad};
 if(crData&&Array.isArray(crData.list))CR.splice(0,CR.length,...crData.list);
 if(stData&&Array.isArray(stData.list))ST.splice(0,ST.length,...stData.list);
 Object.keys(revs).forEach(k=>delete revs[k]);
 (rv.data||[]).forEach(r=>{(revs[r.book_id]=revs[r.book_id]||[]).push({id:r.id,u:r.user_name,n:r.stars,x:r.body,h:r.helpful,real:1,uid:r.user_id})});
 books.forEach(b=>{b.r0=[0,0];revs[b.id]=revs[b.id]||[];recalc(b)});
 feed.splice(0,feed.length,...(fp.data||[]).map(p=>({i:p.id,u:p.user_name,uid:p.user_id,t:p.body,b:p.book_id||0,l:p.likes,d:ago(p.created),c:[]})));
 Object.keys(aw).forEach(k=>delete aw[k]);(vt.data||[]).forEach(r=>{aw[r.book_id]=Number(r.n)});
 nid=Math.max(...books.map(b=>b.id||0),105)+1}
async function afterAuth(ses){
 try{if(ses){const u=ses.user,m=u.user_metadata||{};ME={id:u.id,name:m.name||u.email};user={id:u.id,name:m.name||u.email,email:u.email,role:m.role||"reader"};
   const [a,me,mv]=await Promise.all([
    SB.from("admins").select("user_id").eq("user_id",u.id).maybeSingle(),
    DB.doc("data/users/"+u.id+"/me").get(),
    SB.from("votes").select("book_id").eq("year",2026).maybeSingle()
   ]);
   isAdmin=!!a.data;if(a.error)window.lastErr="admins: "+a.error.message;
   if(me.exists){const d=me.data();mine=d.mine||{};goal=d.goal||12;isPremium=!!d.isPremium}
   myVote=mv.data?mv.data.book_id:null}
  else{user=null;ME=null;isAdmin=false;isPremium=false;mine={};myVote=null}
  await loadShared()}catch(e){window.lastErr=String(e&&e.message||e)}
 render()}
async function init(){
 books.forEach(b=>{b.r0=b.r0||[...(b.r||[0,0])]});
 if(!SB){loadLocal();isAdmin=location.hash==="#owner";render();return}
 DB=mkDB();const r=await SB.auth.getSession();await afterAuth(r.data.session)}
VIEWS.awards=v=>{const nom=books.filter(b=>!b.up&&(SB||aw[b.id]!==undefined)),c=b=>aw[b.id]||0,tot=nom.reduce((a,b)=>a+c(b),0)||1;
 v.innerHTML=`<h2 class="sec">${tr("awards")} 2026</h2><p>${tr("awtx")}</p>${nom.map(b=>`<div class="panel" style="margin-top:10px;display:flex;gap:12px;align-items:center"><div style="width:60px;flex:none">${cover(b)}</div><div style="flex:1"><b>${esc(bt(b))}</b><div class="note">${esc(ba(b))}</div>${myVote?`<div class="vbar"><i style="width:${Math.round(c(b)/tot*100)}%"></i></div><small>${Math.round(c(b)/tot*100)}%</small>`:""}</div>${myVote?(myVote===b.id?"✓":""):`<button class="gold" data-vt="${b.id}">${tr("vote")}</button>`}</div>`).join("")}${myVote?`<p>${tr("voted")}</p>`:""}`;
 v.querySelectorAll("[data-vt]").forEach(x=>x.onclick=async()=>{if(!user)return openLogin("in");const id=+x.dataset.vt;if(SB){const r=await SB.from("votes").insert({year:2026,book_id:id});if(r.error)return}myVote=id;aw[id]=(aw[id]||0)+1;render()})};
function dbg(){if(location.hash!=="#debug")return;let d=$("#dbg");if(!d){d=document.createElement("div");d.id="dbg";d.style.cssText="position:fixed;top:0;left:0;right:0;background:#000;color:#0f0;font:12px monospace;padding:6px;z-index:99;white-space:pre-wrap";document.body.appendChild(d)}d.textContent="SB:"+!!SB+" | user:"+(user?user.email:"none")+" | admin:"+isAdmin+" | prem:"+isPremium+" | books:"+books.length+" | err:"+(window.lastErr||"none")}
render();init();
</script>
</body>
</html>
