<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<title>Adafrus — አደፍርስ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Figtree:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@600;800&family=Noto+Sans+Ethiopic:wght@400;600;700&family=Abyssinica+SIL&family=Playfair+Display:wght@600;800&family=Lora:wght@600;700&family=Merriweather:wght@700&display=swap">
<style>
:root{
  --bg:#F8F6F0;
  --surface:#FFFFFF;
  --surface2:#F1EDE2;
  --ink:#141A29;
  --muted:#5A6275;
  --line:#E2DCCB;
  --gold:#E09F1F;
  --gold-ink:#1A1300;
  --green:#1B7350;
  --red:#B8292F;
  --hero:#9E1B1E;
  --hero-dark:#5C0D10;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F1A;
    --surface:#151C2E;
    --surface2:#1D263D;
    --ink:#F1F3F9;
    --muted:#9AA3BC;
    --line:#26314D;
    --gold:#F5B841;
    --gold-ink:#141000;
    --green:#3CC48E;
    --red:#E05258;
    --hero:#781418;
    --hero-dark:#3B080B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F1A;
  --surface:#151C2E;
  --surface2:#1D263D;
  --ink:#F1F3F9;
  --muted:#9AA3BC;
  --line:#26314D;
  --gold:#F5B841;
  --gold-ink:#141000;
  --green:#3CC48E;
  --red:#E05258;
  --hero:#781418;
  --hero-dark:#3B080B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree','Noto Sans Ethiopic',system-ui,sans-serif;line-height:1.5;padding-bottom:82px}
h1,h2,h3{font-family:var(--hf,'Noto Serif Ethiopic'),'Newsreader',Georgia,serif;margin:0;line-height:1.22}

/* Ethiopian woven tilet band */
.stripe{height:12px;background:repeating-conic-gradient(from 45deg at 50% 50%,#1B7350 0 25%,#E09F1F 0 50%,#9E1B1E 0 75%,#141A29 0);background-size:12px 12px}

/* Header */
header{display:flex;align-items:center;gap:10px;padding:10px 16px;margin:0;flex-wrap:wrap;background:var(--hero);color:#FFFDF9;box-shadow:0 2px 12px rgba(0,0,0,.18);position:sticky;top:0;z-index:15}
header .hr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header button,header select{color:#FFFDF9;border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.08)}
header button:hover,header select:hover{background:rgba(255,255,255,.16)}
header option{color:#141A29;background:#fff}
header .note{color:#F3DFDC;font-weight:600}
#hq{flex:1 1 200px;max-width:480px;order:3;background:rgba(255,255,255,.95);color:#141A29;border:none;border-radius:999px;padding:8px 16px}
#hq::placeholder{color:#666E80}
.logo{font-family:var(--hf,'Noto Serif Ethiopic'),serif;font-weight:800;background:#FFFDF9;color:#9E1B1E!important;padding:2px 15px;border-radius:999px;font-size:1.45rem;letter-spacing:-.01em;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;transition:transform .12s,background .15s,border-color .15s}
button:active{transform:scale(.97)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
button.gold:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

main{max-width:1040px;margin:auto;padding:0 16px 60px}
#tabs{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
#q{flex:1 1 200px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chips button{padding:6px 13px;font-size:.86rem;border-color:var(--line);background:var(--surface)}
.chips button.on{background:var(--hero);color:#fff;border-color:var(--hero);font-weight:600}

/* IMDb-inspired Spotlight + Up Next Hero */
.imdb-hero{display:grid;grid-template-columns:1.85fr 1fr;gap:14px;margin-top:16px;align-items:stretch}
.spot{position:relative;overflow:hidden;border-radius:20px;color:#FFFDF9;background:radial-gradient(circle at 85% 15%,rgba(224,159,31,.38),transparent 50%),linear-gradient(135deg,var(--hero),var(--hero-dark) 78%);padding:24px 20px;display:grid;grid-template-columns:1fr 142px;gap:18px;align-items:center;min-height:310px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.spot:before{content:"አ";position:absolute;right:-16px;bottom:-80px;font-family:'Noto Serif Ethiopic',serif;font-size:18rem;line-height:1;color:rgba(255,255,255,.06);pointer-events:none}
.spot .k{display:inline-flex;align-items:center;gap:6px;letter-spacing:.14em;font-size:.73rem;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.spot h1{font-size:clamp(1.7rem,4.5vw,2.65rem);font-weight:800;color:#FFFDF9}
.spot .sub-author{color:#F5D0C5;font-size:.95rem;margin-top:4px;font-weight:600}
.spot p{color:#F2E4E1;max-width:44ch;font-size:.93rem;margin:10px 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.spot .bk{transform:rotate(3deg);filter:drop-shadow(0 16px 24px rgba(0,0,0,.5));border:none;padding:0;background:none;border-radius:10px}
.spot-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.spot-actions .wl-btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.32);font-weight:600}
.spot-actions .wl-btn.saved{background:var(--green);border-color:var(--green)}
.dots{display:flex;gap:7px;margin-top:14px}
.dots button{width:28px;height:5px;padding:0;border-radius:9px;border:none;background:rgba(255,255,255,.3)}
.dots button.on{background:var(--gold);width:48px}

/* Up Next Sidebar (IMDb style) */
.upnext-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.upnext-box h3{font-size:1rem;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.upn-list{display:grid;gap:8px}
.un{display:flex;gap:10px;text-align:left;border-radius:12px;border:1px solid transparent;background:var(--surface2);padding:7px;align-items:center;width:100%}
.un.on{border-color:var(--gold);background:var(--surface)}
.un .cover{width:42px;flex:none;padding:0;border-radius:6px;box-shadow:none}
.un .cover *{display:none}
.un strong{display:block;font-size:.88rem;line-height:1.25}
.un small{display:block;color:var(--muted);font-size:.78rem}

/* Section Headers (IMDb yellow/red accent bar) */
h2.sec{display:flex;align-items:center;gap:10px;font-size:1.35rem;margin:30px 0 14px;font-weight:800}
h2.sec:before{content:"";width:5px;height:1.2em;border-radius:4px;background:var(--gold);flex:none}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}

/* Book Cards & IMDb-style Watchlist Ribbon */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;margin-top:14px}
.row{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--hero) transparent}
.row .card{width:152px;flex:none}
.card{text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;width:100%;transition:transform .18s,box-shadow .18s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.14)}
.cover{aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff;background-image:linear-gradient(155deg,rgba(255,255,255,.16),rgba(0,0,0,.38));position:relative;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.2);overflow:hidden}
.card .cover{border-radius:0;box-shadow:none}
.cover:after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(0,0,0,.28)}
.cover img.cov-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover .cov-txt{position:relative;z-index:0;display:flex;flex-direction:column;justify-content:space-between;height:100%}
.cover b{font-family:'Noto Serif Ethiopic','Newsreader',serif;font-size:1.05rem;line-height:1.25;padding-left:6px;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.cover span{font-size:.74rem;opacity:.92;padding-left:6px}
.badge{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--gold-ink);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* Quick bookmark ribbon on cards */
.rib{position:absolute;top:0;left:8px;z-index:3;background:rgba(20,26,41,.78);color:#fff;border:none;border-radius:0 0 8px 8px;padding:4px 8px;font-size:.82rem;font-weight:700;line-height:1;backdrop-filter:blur(4px)}
.rib.on{background:var(--green);color:#fff}

.meta{padding:10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.meta .rline{display:flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--ink)}
.meta .rline .st{color:var(--gold)}
.meta strong{display:block;font-family:'Noto Serif Ethiopic','Newsreader',serif;font-size:.94rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta small{color:var(--muted);font-size:.8rem}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}

/* Top 10 IMDb-style numbered cards */
.t10{display:flex;align-items:flex-end;flex:none;border:none;background:none;padding:0;text-align:left;width:196px;position:relative}
.t10 .n{font-family:'Newsreader',serif;font-size:6.4rem;font-weight:800;line-height:.78;color:var(--bg);-webkit-text-stroke:2.5px var(--gold);margin-right:-16px;z-index:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.t10 .cover{width:124px}

/* Dialogs & Slide-out Menu */
dialog{border:none;border-radius:18px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--surface);color:var(--ink);max-height:92vh;box-shadow:0 20px 50px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(8,12,24,.68);backdrop-filter:blur(2px)}
.dl{padding:20px;display:grid;gap:14px}
dialog#menu{margin:0;height:100%;max-height:100%;width:290px;max-width:82vw;border-radius:0 20px 20px 0;overflow-y:auto;border-right:1px solid var(--line)}
#menu .mhead{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--line)}
#menu .mclose{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:50%;font-size:1.1rem;font-weight:700;background:var(--surface2)}
#menu button.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:10px;border:none;padding:10px 12px;font-weight:500}
#menu button.mi:hover,#menu button.mi.on{background:var(--surface2);color:var(--hero);font-weight:700}

.top{display:flex;gap:14px}
.top .cover{width:116px;flex:none;border-radius:8px}
.rate button{border:none;padding:2px;font-size:1.9rem;color:var(--line);line-height:1}
.rate button.on{color:var(--gold)}
.rev{border-top:1px solid var(--line);padding-top:10px}
.rev p{margin:4px 0}
.rev small{color:var(--muted)}
.rev button{padding:3px 10px;font-size:.8rem;border-color:var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.note{font-size:.85rem;color:var(--muted)}
.err{color:var(--red);font-size:.9rem;margin:0;font-weight:600}
.ok{color:var(--green);font-size:.9rem;margin:0;font-weight:600}
.form{display:grid;gap:8px}
.form label{font-size:.85rem;color:var(--muted);font-weight:600}

.av{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,var(--hero),#4A0E12);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.5rem;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.post{border-top:1px solid var(--line);padding:10px 0}
.post:first-of-type{border-top:none;padding-top:0}
.post p{margin:4px 0}
.vbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--hero)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tiles button{border:none;color:#fff;border-radius:16px;padding:15px 12px;text-align:left;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tiles button b{display:block;font-size:1.5rem;margin-bottom:4px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.award{border-radius:20px;padding:22px;color:#1F1400;background:linear-gradient(135deg,#F7CA65,#E09F1F);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-top:28px;box-shadow:0 8px 22px rgba(224,159,31,.25)}
.award h3{font-size:1.45rem}
.award p{margin:4px 0 0}
.award button{background:#141A29;color:#fff;border-color:#141A29;font-weight:700}

.mapcard{border-radius:20px;padding:22px;margin-top:18px;color:#fff;background:linear-gradient(rgba(20,26,41,.88),rgba(20,26,41,.88)),repeating-linear-gradient(0deg,#fff2 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,#fff2 0 1px,transparent 1px 28px);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

/* Bottom Navigation Bar */
#bn{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#bn button{border:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;padding:4px 2px;border-radius:12px;color:var(--muted);font-weight:600}
#bn button b{font-size:1.22rem;line-height:1}
#bn button.on{color:var(--hero);background:rgba(158,27,30,.12)}

footer#ft{background:var(--hero-dark);color:#E5DCE0;padding:28px 18px;text-align:center;margin-top:36px}
.fl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.fl button{border:none;color:#E5DCE0;padding:4px 10px}

.pill-tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700}
.pill-ok{background:rgba(27,115,80,.15);color:var(--green)}
.pill-wait{background:rgba(224,159,31,.2);color:var(--gold)}
.pill-no{background:rgba(184,41,47,.15);color:var(--red)}

.plans,.memb{display:none}
#bell{border-color:rgba(255,255,255,.35)}

@media (max-width:780px){
  .imdb-hero{grid-template-columns:1fr}
  .upn-list{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .two{grid-template-columns:1fr}
}
@media (max-width:540px){
  .spot{grid-template-columns:1fr 106px;padding:18px 15px;min-height:250px}
  .spot:before{font-size:13rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <div class="logo" id="logo"></div>
  <input id="hq" type="search">
  <div class="hr">
    <button id="proBtn"></button>
    <button id="listBtn"></button>
    <select id="lg" aria-label="Language">
      <option value="am">🌐 አማርኛ</option>
      <option value="en">🌐 English</option>
      <option value="om">🌐 Afaan Oromoo</option>
      <option value="ti">🌐 ትግርኛ</option>
    </select>
    <button id="bell" aria-label="Notifications"></button>
    <span id="who" class="note"></span>
    <button id="loginBtn" class="primary"></button>
  </div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <p class="note" id="foot"></p>
</main>
<footer id="ft"></footer>
<nav id="bn"></nav>
<dialog id="login"><div class="dl" id="lgc"></div></dialog>
<dialog id="bk"><div class="dl" id="bkc"></div></dialog>
<dialog id="menu"><div class="dl" id="mc"></div></dialog>
<dialog id="nt"><div class="dl" id="ntc"></div></dialog>

// Book cover with automatic Open Library fallback if ISBN exists, plus custom uploaded image support
const cover=(b,badge)=>{
  const olUrl=b.isbn?`https://covers.openlibrary.org/b/isbn/${b.isbn}-M.jpg?default=false`:"";
  const src=b.img||olUrl;
  return `<div class="cover" style="background-color:${b.c}">
    ${badge?`<div class="badge">${badge}</div>`:""}
    <div class="cov-txt"><b>${esc(bt(b))}</b><span>${esc(ba(b))}</span></div>
    ${src?`<img class="cov-img" src="${esc(src)}" alt="${esc(bt(b))}" loading="lazy" onerror="this.remove()">`:""}
  </div>`;
};

 if(tab==="books"){
  let list=books.filter(b=>(!lang||b.l===lang)&&(!gen||b.g===gen)&&(b.t+b.e+b.a+b.ae).toLowerCase().includes(term.toLowerCase()));
  list.sort(sort==="top"?(a,b)=>b.r[0]-a.r[0]||(b.y-a.y):sort==="new"?(a,b)=>b.y-a.y:(a,b)=>bt(a).localeCompare(bt(b),LC[li]));

  <div class="chips"><button data-l="" class="${!lang?"on":""}">${tr("alll")}</button>${LK.map(k=>`<button data-l="${k}" class="${lang===k?"on":""}">${LN[k]}</button>`).join("")}</div>
  <div class="chips"><button data-g="" class="${!gen?"on":""}">${tr("allg")}</button>${GK.map(k=>`<button data-g="${k}" class="${gen===k?"on":""}">${gn(k)}</button>`).join("")}</div>

  bindCards(v);
  if($("#add"))$("#add").onclick=()=>editBook(null);

  v.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>openBook(+x.dataset.id));
  $("#gl").onchange=e=>{goal=Math.max(1,+e.target.value||1);saveMe();render()};

function toggleQuickList(id){
 if(!user)return openLogin("in");
 if(mine[id])delete mine[id];else mine[id]="s0";
 saveMe();render();
}

function bindCards(root){
 root.querySelectorAll("[data-id]").forEach(c=>c.onclick=e=>{
  if(e.target.closest("[data-wl]"))return;
  openBook(+c.dataset.id);
 });
 root.querySelectorAll("[data-wl]").forEach(b=>b.onclick=e=>{
  e.stopPropagation();
  toggleQuickList(+b.dataset.wl);
 });
}

function editBook(id,sub){subMode=!!sub;
 const nb=id===null,b=nb?{t:"",e:"",a:"",ae:"",l:"am",g:"fic",y:2025,c:"#1B7350",s:"",se:"",r:[0,0]}:books.find(x=>x.id===id);

 $("#bkc").innerHTML=`<h2>${nb?tr("nb"):tr("eb")}</h2><div class="form">
 <label>${L[0]}</label><input id="f1" value="${esc(b.t)}"><label>${L[1]}</label><input id="f2" value="${esc(b.e)}">
 <label>${L[2]}</label><input id="f3" value="${esc(b.a)}"><label>${L[3]}</label><input id="f4" value="${esc(b.ae)}">
 <label>${L[4]}</label><select id="f5">${o(LK,x=>LN[x],b.l)}</select><label>${L[5]}</label><select id="f6">${o(GK,gn,b.g)}</select>

 <p class="err" id="fe"></p><button class="primary" id="sv">${tr("save")}</button><button id="cx">${tr("cancel")}</button>`;
 let img=b.img||"";
 $("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,360/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.72);$("#pv").src=img;$("#pv").style.display="block"};im.src=r.result};r.readAsDataURL(f)};
 $("#cx").onclick=()=>nb?$("#bk").close():openBook(b.id);
 $("#sv").onclick=async()=>{const t=$("#f1").value.trim(),e=$("#f2").value.trim();if(!t&&!e){$("#fe").textContent=tr("e6");return}
  Object.assign(b,{t:t||e,e:e||t,a:$("#f3").value.trim()||"—",ae:$("#f4").value.trim()||$("#f3").value.trim()||"—",l:$("#f5").value,g:$("#f6").value,y:+$("#f7").value||2025,s:$("#f8").value.trim(),se:$("#f9").value.trim(),img});

  await saveBooks();render();nb?$("#bk").close():openBook(b.id)};
 if(!$("#bk").open)$("#bk").showModal();

function openBook(id){
 const b=books.find(x=>x.id===id);if(!b)return;
 const rv=revs[id]||(revs[id]=[]);let pick=0;viewed=[id,...viewed.filter(x=>x!==id)].slice(0,8);
 const need=()=>{$("#bk").close();openLogin("in")};
 const draw=()=>{
  $("#bkc").innerHTML=`<div class="top">${cover(b)}<div><h2>${esc(bt(b))}</h2><p class="note">${esc(ba(b))}${b.uid&&VER.includes(b.uid)?" ✓":""}<br>${LN[b.l]} · ${gn(b.g)} · ${b.y}</p><div>${stars(b.r[0])} <b>${avg(b)}</b> <small>(${b.r[1]})</small></div>${isAdmin?`<button id="ed" style="margin-top:8px;padding:4px 12px">${tr("edit")}</button>`:""}<button id="sh" style="margin-top:8px;padding:4px 12px">🔗 ${tr("share")}</button></div></div>
  <p>${esc(bs(b))}</p>
  <div><b>${tr("addl")}</b><div class="chips">${["s0","s1","s2"].map(x=>`<button data-s="${x}" class="${mine[id]===x?"on":""}">${tr(x)}</button>`).join("")}</div></div>
  <div><b>${tr("rate")}</b><div class="rate">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${n<=pick?"on":""}" aria-label="${n}">★</button>`).join("")}</div>
  <textarea id="rt" rows="3" placeholder="${tr("ph")}" style="width:100%"></textarea><p class="err" id="re"></p><button class="primary" id="sub">${tr("post")}</button></div>
  <h3>${tr("revs")} (${rv.length})</h3>${rv.map((r,i)=>`<div class="rev">${stars(r.n)} <small>${esc(r.u)}</small><p>${esc(r.x)}</p><button data-h="${i}">👍 ${tr("help")} (${r.h})</button></div>`).join("")||`<p>${tr("none")}</p>`}
  <button id="cl">${tr("close")}</button>`;
  $("#cl").onclick=()=>$("#bk").close();
  if($("#ed"))$("#ed").onclick=()=>editBook(id);
  $("#sh").onclick=()=>{try{navigator.share?navigator.share({title:bt(b),url:location.href}):navigator.clipboard.writeText(location.href)}catch(e){}};
  document.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>{if(!user)return need();mine[id]=x.dataset.s;saveMe();draw();render()});
  document.querySelectorAll("[data-n]").forEach(x=>x.onclick=()=>{pick=+x.dataset.n;draw()});
  document.querySelectorAll("[data-h]").forEach(x=>x.onclick=()=>{const r=rv[+x.dataset.h];r.h++;if(SB&&r.id)SB.rpc("bump_helpful",{rid:r.id});else saveRev(id);draw()});
  $("#sub").onclick=()=>{if(!user)return need();if(!pick){$("#re").textContent=tr("e5");return}
   rv.unshift({u:user.name,n:pick,x:$("#rt").value.trim(),h:0,real:1,uid:user.id});recalc(b);saveRev(id);render();draw()};
 };
 draw();if(!$("#bk").open)$("#bk").showModal();
}

function applySet(){const r=document.documentElement.style;if(SET.font)r.setProperty("--hf","'"+SET.font+"'");if(SET.accent)r.setProperty("--gold",SET.accent)}
function recalc(b){const rv=(revs[b.id]||[]).filter(r=>r.real),r0=b.r0||(b.r0=[0,0]),n=rv.length,t=rv.reduce((a,r)=>a+r.n,0);b.r=[r0[1]+n?(r0[0]*r0[1]+t)/(r0[1]+n):0,r0[1]+n]}
const W=(path,data)=>{if(DB)return DB.doc(path).set(data).catch(e=>{window.lastErr=String(e&&e.message||e)});try{const m=JSON.parse(localStorage.getItem("adafrus_kv")||"{}");m[path]=data;localStorage.setItem("adafrus_kv",JSON.stringify(m))}catch(e){}return Promise.resolve()};

function saveRev(id){if(SB){const r=revs[id][0];if(r&&!r.id&&r.real)SB.from("reviews").insert({book_id:id,user_name:r.u,stars:r.n,body:r.x}).select().single().then(x=>{if(x.data)r.id=x.data.id});return}W("reviews/"+id,{list:revs[id]})}

 // 1-tap Starter Catalog import: keeps any custom books with uploaded photos, replaces old sample placeholders with 28 real Ethiopian books
 $("#imp").onclick=async()=>{
  $("#imp").disabled=true;$("#imp").textContent="⏳ Saving...";
  const custom=books.filter(b=>b.img&&!(b.e||"").toLowerCase().includes("sample")&&!(b.t||"").includes("ናሙና"));
  const merged=[...custom];
  STARTER_BOOKS.forEach(sb=>{
   if(!merged.some(x=>x.t===sb.t||x.e===sb.e))merged.push(JSON.parse(JSON.stringify(sb)));
  });
  merged.forEach((b,i)=>{b.id=i+1;revs[b.id]=revs[b.id]||[];recalc(b)});

  nid=books.length+1;

  render();

 v.innerHTML=`<h2 class="sec">${tr("awards")} 2026</h2><p>${tr("awtx")}</p>${nom.map(b=>`<div class="panel" style="margin-top:10px;display:flex;gap:12px;align-items:center"><div style="width:60px;flex:none">${cover(b)}</div><div style="flex:1"><b>${esc(bt(b))}</b><div class="note">${esc(ba(b))}</div>${myVote?`<div class="vbar"><i style="width:${Math.round(c(b)/tot*100)}%"></i></div><small>${Math.round(c(b)/tot*100)}%</small>`:""}</div>${myVote?(myVote===b.id?"✓":""):`<button class="gold" data-vt="${b.id}">${tr("vote")}</button>`}</div>`).join("")}${myVote?`<p>${tr("voted")}</p>`:""}`;
 v.querySelectorAll("[data-vt]").forEach(x=>x.onclick=async()=>{if(!user)return openLogin("in");const id=+x.dataset.vt;if(SB){const r=await SB.from("votes").insert({year:2026,book_id:id});if(r.error)return}myVote=id;aw[id]=(aw[id]||0)+1;render()})};
function dbg(){if(location.hash!=="#debug")return;let d=$("#dbg");if(!d){d=document.createElement("div");d.id="dbg";d.style.cssText="position:fixed;top:0;left:0;right:0;background:#000;color:#0f0;font:12px monospace;padding:6px;z-index:99;white-space:pre-wrap";document.body.appendChild(d)}d.textContent="SB:"+!!SB+" | user:"+(user?user.email:"none")+" | admin:"+isAdmin+" | books:"+books.length+" | err:"+(window.lastErr||"none")}
render();init();
</script>
